<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>本地实时字幕</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><strong>本地实时字幕</strong><span id="status-dot" class="dot disconnected"></span></header>
  <label class="toggle-row"><span>显示字幕</span><input id="toggle-subtitles" type="checkbox" checked></label>
  <label>源语言</label>
  <select id="source-language">
    <option value="">自动识别</option><option value="English">英语</option>
    <option value="Japanese">日语</option><option value="Korean">韩语</option>
    <option value="French">法语</option><option value="German">德语</option>
    <option value="Spanish">西班牙语</option><option value="Russian">俄语</option>
  </select>
  <label>翻译为</label>
  <select id="target-language">
    <option value="简体中文">简体中文</option><option value="繁体中文">繁体中文</option>
    <option value="English">英语</option>
  </select>
  <label>字幕字号</label><input id="font-size" type="range" min="16" max="48" step="1" value="28">
  <label>字幕位置</label>
  <select id="position"><option value="bottom">底部</option><option value="top">顶部</option></select>
  <label class="toggle-row"><span>同时显示原文</span><input id="show-original" type="checkbox"></label>
  <button id="save-btn">应用设置</button>
  <p id="status-text">正在连接本地服务……</p>
  <script src="popup.js"></script>
</body>
</html>
